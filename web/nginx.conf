# The SPA is a single-page app: any path that is not a file falls back to
# index.html so a deep link like /trees/t1/people/p09 survives a refresh.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API. Same origin as the page, which is the point of putting the
  # prefix on the server: no CORS in production, no second hostname to
  # configure, and a cookie or bearer token behaves the same everywhere.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    # `$http_host`, not `$host`: nginx's `$host` has the port stripped, so it
    # would arrive as `localhost` while the browser's `Origin` is
    # `http://localhost:8080` — and AuthGuard compares the two on every
    # state-changing request, which would answer 403 to *everything* the SPA
    # tries to write. `$http_host` is the header as sent, port included.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;

    # Headers for the document and its assets — this is the response XSS
    # would have to live inside, so this is where the policy belongs.
    #
    #   script-src 'self'            no inline script, no CDN, no eval: a
    #                                 <script> an injected value could write
    #                                 cannot run, because it is neither this
    #                                 origin nor inline
    #   style-src 'self' 'unsafe-inline'
    #                                 Vue writes style="" attributes on cards
    #                                 and canvases; styles are data, not code,
    #                                 and blocking them breaks the layout
    #                                 without raising the bar for script
    #   img-src 'self' data: https:  a photograph on a person may be a
    #                                 remote https URL (photoUrl)
    #   object-src 'none'            no plugins to load and exploit
    #   frame-ancestors 'none'       Puong is not to be framed anywhere
    #
    # The API's own responses are not covered here: they carry the policy
    # set by helmet in api/src/main.ts, and two different policies on one
    # response would be two documents to keep in step.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
  }
}
