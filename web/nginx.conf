# The default, plain-http server: what `docker compose up` serves on :8080.
#
# The SPA is a single-page app: any path that is not a file falls back to
# index.html so a deep link like /trees/t1/people/p09 survives a refresh.
#
# Every rule lives in /etc/nginx/app.conf, which is also included by the TLS
# server (see web/nginx.tls.conf and docker-compose.tls.yml) so the two modes
# cannot disagree about the CSP, the headers or the proxy.
server {
  listen 80;
  server_name _;

  include /etc/nginx/app.conf;
}
