# The SPA is a single-page app: any path that is not a file falls back to
# index.html so a deep link like /trees/t1/people/p09 survives a refresh.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API. Same origin as the page, which is the point of putting the
  # prefix on the server: no CORS in production, no second hostname to
  # configure, and a cookie or bearer token behaves the same everywhere.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
