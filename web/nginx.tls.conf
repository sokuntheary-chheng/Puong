# The TLS server: what
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up
#
# serves. Port 80 is kept for one purpose only — moving a browser to https —
# and answers everything else with a 301 to the same path over TLS.
#
# This file is *not* mounted as the live configuration: `25-select-tls.sh`
# copies it into conf.d/default.conf when TLS_MODE=true, running envsubst
# over ${WEB_TLS_PORT} first. That is how the redirect can name the port the
# container is actually published on (8443 locally, 443 on a server with a
# real address): `$host` carries no port, and a redirect to https://host/
# while TLS is on :8443 lands on nothing.
#
# The certificate is whatever sits at /etc/nginx/certs/tls.{crt,key}. If the
# directory is empty, `40-self-signed-cert.sh` creates a self-signed pair on
# first start so the stack comes up with no setup at all; drop a real
# certificate in there, restart, and nothing else changes.
#
# All application rules are in /etc/nginx/app.conf, shared with the plain
# http server (web/nginx.conf) so there is exactly one CSP and one proxy.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # 80 exists only to move a browser to https. Answering 200 with a page from
  # a plaintext listener would make the "secure" half of the URL a claim the
  # server did not earn.
  return 301 https://$host:${WEB_TLS_PORT}$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;

  # Baseline TLS: 1.2 minimum (the session cookie is only worth what the
  # transport is), modern suites, a shared session cache so a returning
  # browser does not pay a full handshake for every asset it reloads.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/app.conf;
}
