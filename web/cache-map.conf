# How long a browser may keep what this server sends.
#
# Included by both server files (web/nginx.conf and web/nginx.tls.conf) at
# http level, because `map` is an http-level directive while app.conf —
# where the header is actually set — sits inside `server`. One rule, two
# includes, exactly the arrangement app.conf already has for the CSP.
#
# The rule is keyed on the URL because the two halves of a Vite build want
# opposite answers:
#
#   default (the document, and every deep link that falls back to it)  no-cache
#     index.html names the hashed files under /assets/. A copy of it that
#     outlives its build asks for chunks this build does not have; the SPA
#     fallback then answers a .js request with HTML, the dynamic import
#     fails, and the member gets a header, a footer and an empty <main> —
#     a blank screen that looks exactly like an API that never answered.
#     So it revalidates on every load: nothing changed costs a 304, not a
#     download, and a changed build is picked up immediately.
#
#   /assets/*                                                 immutable
#     The filename changes whenever the content does, so a cached copy is
#     either current or unreachable — no third possibility — which is what
#     `immutable` says, and it stops the browser asking at all.
#
# Uploaded photographs are not here: they are served by the API under
# /api/uploads/, which sets its own `private` policy (docs/api.md).
map $uri $spa_cache_control {
  default    "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
}