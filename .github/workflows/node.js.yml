# This file *replaces* the Node.js template that GitHub put on `main` when
# the repository was created — it is not a new workflow.
#
# That template ran `npm ci` at the repository root. There is no root
# package.json here: the project is two workspaces (api/ and web/) plus a
# dev-only e2e/, and they are installed separately. So the template failed
# before doing anything useful, on Node 18, 20 and 22 alike, on every push
# and every pull request — three red checks that carried no information.
#
# The workflow that actually does that job is ci.yml in this directory:
# lint, typecheck, tests and build for both workspaces, the contract check
# against the built server, and the browser stories against the composed
# stack. Running a second, broken copy of the same idea only teaches people
# to ignore red checks, so this one is left on workflow_dispatch — it can be
# started by hand, and never reports on a commit.

name: Node.js CI

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nothing to build here — the CI for this repository is .github/workflows/ci.yml"
